<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#15171c"><title>Image Tools — 拡大・形式変換</title><meta name="description" content="画像をブラウザ内で拡大し、PNGとJPEGを変換。iPhoneとPCで使えます。"><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><strong>IMAGE TOOLS</strong><small>画像の拡大・形式変換</small></div></div><span class="top-note">画像は端末内で処理</span></header>
<main class="workspace"><section class="panel settings" aria-label="画像の設定"><div class="section-title"><span class="eyebrow">01 / SOURCE</span><h1>画像を選ぶ</h1></div><label class="upload" id="dropzone"><input id="file" type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg"><span class="upload-icon" aria-hidden="true">＋</span><strong>画像を選択</strong><span>PNG / JPG · ドラッグ＆ドロップ対応</span></label><div id="sourceInfo" class="source-info" hidden></div>
<div class="rule"></div><div class="section-title"><span class="eyebrow">02 / SIZE</span><h2>出力サイズ</h2></div><fieldset class="choice-grid" id="sizes"><legend class="sr-only">出力サイズ</legend><label><input type="radio" name="size" value="1" checked><span>元サイズ</span></label><label><input type="radio" name="size" value="2"><span>2倍</span></label><label><input type="radio" name="size" value="4"><span>4倍</span></label><label><input type="radio" name="size" value="2560"><span>長辺 2560px</span></label></fieldset><p class="help">縦横比を保って拡大します。長辺指定は画像がすでに大きければ元サイズを維持します。</p>
<div class="rule"></div><div class="section-title"><span class="eyebrow">03 / FORMAT</span><h2>保存形式</h2></div><fieldset class="choice-grid formats"><legend class="sr-only">保存形式</legend><label><input type="radio" name="format" value="image/png" checked><span>PNG <small>透過を維持</small></span></label><label><input type="radio" name="format" value="image/jpeg"><span>JPG <small>容量を抑える</small></span></label></fieldset><div class="jpg-options" id="jpgOptions" hidden><label class="field-label" for="quality">画質 <output id="qualityValue">90%</output></label><input id="quality" type="range" min="50" max="100" value="90"><label class="field-label" for="matte">透明部分の背景色</label><div class="matte-row"><input id="matte" type="color" value="#ffffff"><span id="matteValue">#FFFFFF</span></div></div>
<div class="rule"></div><button class="primary" id="convert" disabled>画像を作成</button><p class="help">画像生成クレジットは使いません。細部を新たに描くAI超解像ではなく、高品質な補間で拡大します。</p></section>
<section class="preview-area" aria-label="画像プレビュー"><div class="preview-head"><div><span class="eyebrow">PREVIEW</span><h2>仕上がりを確認</h2></div><span id="outputDimensions" class="dim">画像を選択してください</span></div><div class="preview-box" id="previewBox"><div id="empty" class="empty"><div class="empty-frame" aria-hidden="true"><span></span></div><strong>ここに画像を表示します</strong><p>左の「画像を選択」から始めてください</p></div><img id="previewImage" alt="選択した画像のプレビュー" hidden></div><div class="preview-foot"><span id="previewLabel">元画像</span><span id="previewMeta">—</span></div><div id="result" class="result" hidden><div><strong>画像を作成しました</strong><p id="resultInfo"></p></div><a class="download" id="download" download>画像を保存 <span aria-hidden="true">↓</span></a></div><p id="status" class="status" role="status" aria-live="polite"></p></section></main><script src="app.js" defer></script></body></html>
